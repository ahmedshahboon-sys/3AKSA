name: Production Deploy

on:
  push:
    branches:
      - release/1.0.1-public-beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3aksa-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Require production SSH secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name/SSH_/PRODUCTION_SSH_}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/3aksa_deploy_key
          chmod 600 ~/.ssh/3aksa_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy reviewed release branch
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/3aksa_deploy_key -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "3aksa-github-deploy $GITHUB_SHA"

      - name: Public post-deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 15 https://marbo3a.ly/3aksa/api/health
          printf '\n'
          curl -fsS --connect-timeout 5 --max-time 15 https://marbo3a.ly/3aksa/api/ready
          printf '\n'
