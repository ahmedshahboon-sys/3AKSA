name: Production Deploy

on:
  push:
    branches:
      - release/1.0.1-public-beta

permissions:
  contents: read

concurrency:
  group: 3aksa-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Require production SSH secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name/SSH_/PRODUCTION_SSH_}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/3aksa_deploy_key
          chmod 600 ~/.ssh/3aksa_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy reviewed release branch
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/3aksa_deploy_key -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          EXPECTED_SHA="$1"
          ROOT=/opt/3aksa
          BRANCH=release/1.0.1-public-beta

          as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          if [ ! -d "$ROOT/.git" ]; then
            echo "Missing 3AKSA repository at $ROOT" >&2
            exit 20
          fi

          cd "$ROOT"
          git fetch --prune origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git reset --hard "origin/$BRANCH"

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Release SHA mismatch: expected=$EXPECTED_SHA actual=$ACTUAL_SHA" >&2
            exit 21
          fi

          if [ -s /etc/3aksa/3aksa.env ]; then
            as_root bash -lc 'set -Eeuo pipefail; set -a; source /etc/3aksa/3aksa.env; set +a; cd /opt/3aksa; bash scripts/ops/backup.sh'
          else
            echo "First deployment: no existing /etc/3aksa/3aksa.env, backup step skipped."
          fi

          as_root bash "$ROOT/infra/server/deploy-trial.sh"
          bash "$ROOT/infra/server/verify-production.sh"

          echo "DEPLOYED_SHA=$ACTUAL_SHA"
          REMOTE

      - name: Public post-deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 15 https://marbo3a.ly/3aksa/api/health
          printf '\n'
          curl -fsS --connect-timeout 5 --max-time 15 https://marbo3a.ly/3aksa/api/ready
          printf '\n'
