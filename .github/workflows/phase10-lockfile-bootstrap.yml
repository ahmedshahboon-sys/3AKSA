name: Phase 10 Lockfile Bootstrap

on:
  push:
    branches:
      - feature/phase10-production-security-release

permissions:
  contents: write

concurrency:
  group: phase10-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase10-production-security-release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate

      - name: Generate lockfile without running package scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(phase10): generate pnpm lockfile"
          git push origin HEAD:feature/phase10-production-security-release
