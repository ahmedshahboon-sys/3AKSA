name: Phase 1 CI

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - feature/phase1-visual-foundation

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Phase 1
        run: pnpm verify

      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3aksa-web-phase1
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
