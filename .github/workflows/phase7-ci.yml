name: Phase 7 CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: phase7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared application
        run: pnpm typecheck

      - name: Build Web/PWA
        run: pnpm --filter @3aksa/web build

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      ANDROID_APP_ID: ly.threeaksa.app
      VITE_PUBLIC_BASE_PATH: /
      VITE_API_BASE_URL: https://marbo3a.ly/3aksa/api
      VITE_SOCKET_URL: https://marbo3a.ly
      VITE_SOCKET_PATH: /3aksa/socket.io
      VITE_PUBLIC_APP_URL: https://marbo3a.ly/3aksa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android web assets
        run: pnpm --filter @3aksa/web build

      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          node scripts/install-secure-store.mjs

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 3aksa-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
